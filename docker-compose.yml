services:
  aria2:
    image: p3terx/aria2-pro:latest
    container_name: aria2-onedrive
    restart: unless-stopped
    environment:
      PUID: "0"
      PGID: "0"
      UMASK_SET: "022"
      RPC_SECRET: ${ARIA2_RPC_SECRET}
      RPC_PORT: "6800"
      LISTEN_PORT: "6888"
      DISK_CACHE: "64M"
      IPV6_MODE: "false"
      UPDATE_TRACKERS: "true"
      SPECIAL_MODE: "rclone"
      TZ: ${TZ:-Asia/Shanghai}
      RCLONE_CONFIG: /config/rclone.conf
      RCLONE_TRANSFERS: "2"
      RCLONE_RETRIES: "3"
      RCLONE_RETRIES_SLEEP: "10s"
    volumes:
      - ./config:/config
      - ./downloads:/downloads
    expose:
      - "6800"
    ports:
      - "6888:6888/tcp"
      - "6888:6888/udp"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: 1800m
    cpus: 1.5

  ariang:
    image: p3terx/ariang:latest
    container_name: ariang
    restart: unless-stopped
    command: --port 6880
    expose:
      - "6880"
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
    mem_limit: 256m
    cpus: 0.5

  caddy:
    image: caddy:2
    container_name: aria2-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "8080"
    depends_on:
      - aria2
      - ariang
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
    mem_limit: 256m
    cpus: 0.5

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aria2-cloudflared
    profiles:
      - tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"
    mem_limit: 256m
    cpus: 0.5
